<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#132033" stroke-width="1"/></pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4b6178"/></marker>
  </defs>
  <rect width="1200" height="330" rx="16" fill="#070c15"/>
  <rect width="1200" height="330" rx="16" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1199" height="329" rx="16" fill="none" stroke="#1e3a4c"/>
  <text x="40" y="52" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="900" font-size="26" fill="#e2f3ff" letter-spacing="3">THE PIPELINE</text>
  <text x="1160" y="50" text-anchor="end" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#5b7590">event → bundle in one pass</text>
  <path d="M40 68 H1160" stroke="#16263a"/>
  <path d="M40 308 H1160" stroke="#16263a" stroke-dasharray="2 6"/>
  <rect x="40" y="104" width="196" height="186" rx="12" fill="#0b1422" stroke="#22d3ee" stroke-opacity="0.55"/>
  <rect x="40" y="104" width="196" height="5" rx="2" fill="#22d3ee" filter="url(#glow)"/>
  <text x="58" y="146" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#22d3ee">01</text>
  <text x="58" y="180" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="900" font-size="24" fill="#e2f3ff" letter-spacing="2">LISTEN</text>
  <text x="58" y="216" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#8aa2bb">logsSubscribe ×2</text>
  <text x="58" y="240" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#8aa2bb">pump.fun TradeEvent</text>
  <text x="58" y="264" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#8aa2bb">PumpSwap Buy/Sell</text>
  <path d="M240 197 H270" stroke="#4b6178" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="276" y="104" width="196" height="186" rx="12" fill="#0b1422" stroke="#2dd4bf" stroke-opacity="0.55"/>
  <rect x="276" y="104" width="196" height="5" rx="2" fill="#2dd4bf" filter="url(#glow)"/>
  <text x="294" y="146" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#2dd4bf">02</text>
  <text x="294" y="180" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="900" font-size="24" fill="#e2f3ff" letter-spacing="2">DISCOVER</text>
  <text x="294" y="216" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#8aa2bb">AMM pool → curve</text>
  <text x="294" y="240" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#8aa2bb">curve mint → gPA</text>
  <text x="294" y="264" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#8aa2bb">negative cache 30m</text>
  <path d="M476 197 H506" stroke="#4b6178" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="512" y="104" width="196" height="186" rx="12" fill="#0b1422" stroke="#fbbf24" stroke-opacity="0.55"/>
  <rect x="512" y="104" width="196" height="5" rx="2" fill="#fbbf24" filter="url(#glow)"/>
  <text x="530" y="146" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#fbbf24">03</text>
  <text x="530" y="180" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="900" font-size="24" fill="#e2f3ff" letter-spacing="2">PRICE</text>
  <text x="530" y="216" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#8aa2bb">vSol / vTok</text>
  <text x="530" y="240" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#8aa2bb">(vault+virtual)/base</text>
  <text x="530" y="264" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#8aa2bb">BigInt cross-mul</text>
  <path d="M712 197 H742" stroke="#4b6178" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="748" y="104" width="196" height="186" rx="12" fill="#0b1422" stroke="#f472b6" stroke-opacity="0.55"/>
  <rect x="748" y="104" width="196" height="5" rx="2" fill="#f472b6" filter="url(#glow)"/>
  <text x="766" y="146" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#f472b6">04</text>
  <text x="766" y="180" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="900" font-size="24" fill="#e2f3ff" letter-spacing="2">SIZE</text>
  <text x="766" y="216" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#8aa2bb">fee tiers per venue</text>
  <text x="766" y="240" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#8aa2bb">binary + ternary</text>
  <text x="766" y="264" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#8aa2bb">net of tip + fees</text>
  <path d="M948 197 H978" stroke="#4b6178" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="984" y="104" width="196" height="186" rx="12" fill="#0b1422" stroke="#c026d3" stroke-opacity="0.55"/>
  <rect x="984" y="104" width="196" height="5" rx="2" fill="#c026d3" filter="url(#glow)"/>
  <text x="1002" y="146" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#c026d3">05</text>
  <text x="1002" y="180" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="900" font-size="24" fill="#e2f3ff" letter-spacing="2">FIRE</text>
  <text x="1002" y="216" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#8aa2bb">one v0 tx, 2 legs</text>
  <text x="1002" y="240" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#8aa2bb">min_out profit guard</text>
  <text x="1002" y="264" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#8aa2bb">Jito sendBundle</text>
  <circle r="4" fill="#fbbf24" filter="url(#glow)"><animateMotion dur="4s" repeatCount="indefinite" path="M40 308 H1160"/></circle>
</svg>
