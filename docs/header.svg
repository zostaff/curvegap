<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060b14"/>
      <stop offset="1" stop-color="#0b0716"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1b2a3d" stroke-width="1"/>
    </pattern>
    <pattern id="gridfine" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M8 0H0V8" fill="none" stroke="#111b29" stroke-width="0.6"/>
    </pattern>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="mag" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0abfc"/>
      <stop offset="1" stop-color="#c026d3"/>
    </linearGradient>
    <linearGradient id="gapfill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.65"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="380" rx="18"/></clipPath>
    <linearGradient id="pillcyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="pillpink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbcfe8"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#gridfine)"/>
    <rect width="1200" height="380" fill="url(#grid)"/>

    <!-- price curves: bonding curve (cyan) vs AMM (magenta) -->
    <path d="M-10 340 C 250 330, 520 280, 720 170 S 1050 10, 1220 -20" fill="none" stroke="url(#cyan)" stroke-width="3" opacity="0.55" filter="url(#glow)"/>
    <path d="M-10 360 C 260 352, 560 318, 760 240 S 1060 100, 1220 60" fill="none" stroke="url(#mag)" stroke-width="3" opacity="0.55" filter="url(#glow)"/>


    <rect width="1200" height="380" fill="url(#vignette)"/>

    <!-- pill logo (cyan / pink capsule) -->
    <g transform="translate(140 150) rotate(-42)" filter="url(#softglow)">
      <clipPath id="pillclip"><rect x="-86" y="-36" width="172" height="72" rx="36"/></clipPath>
      <g clip-path="url(#pillclip)">
        <rect x="-86" y="-36" width="86" height="72" fill="url(#pillcyan)"/>
        <rect x="0" y="-36" width="86" height="72" fill="url(#pillpink)"/>
        <rect x="-70" y="-26" width="140" height="14" rx="7" fill="#ffffff" opacity="0.28"/>
        <rect x="-2" y="-36" width="4" height="72" fill="#060b14" opacity="0.85"/>
      </g>
      <rect x="-86" y="-36" width="172" height="72" rx="36" fill="none" stroke="#e2f3ff" stroke-opacity="0.35" stroke-width="2"/>
    </g>
    <!-- wordmark: CURVE | GAP | -->
    <g font-family="'Arial Black', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="900" font-size="124" letter-spacing="6">
      <text x="250" y="206" fill="url(#cyan)" filter="url(#softglow)" textLength="490" lengthAdjust="spacingAndGlyphs">CURVE</text>
      <text x="806" y="206" fill="url(#mag)" filter="url(#softglow)" textLength="320" lengthAdjust="spacingAndGlyphs">GAP</text>
    </g>
    <!-- glowing gap between the halves -->
    <rect x="751" y="98" width="44" height="124" fill="url(#gapfill)"/>
    <rect x="771" y="82" width="4" height="156" rx="2" fill="#fbbf24" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.45;1" dur="1.8s" repeatCount="indefinite"/>
    </rect>

    <!-- tagline -->
    <rect x="0" y="250" width="1200" height="86" fill="#060b14" opacity="0.72"/>
    <path d="M0 250 H1200 M0 336 H1200" stroke="#16263a"/>
    <text x="600" y="282" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="21" fill="#9fb3c8" letter-spacing="5">ATOMIC ARBITRAGE · PUMP.FUN CURVE ⇄ PUMPSWAP AMM · SOLANA</text>
    <text x="600" y="320" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#4b6178" letter-spacing="3">two legs · one v0 transaction · one jito bundle · all or nothing</text>

    <!-- corner ticks -->
    <g stroke="#2dd4bf" stroke-width="2" opacity="0.7" fill="none">
      <path d="M24 48 V24 H48"/><path d="M1152 24 H1176 V48"/>
      <path d="M24 332 V356 H48"/><path d="M1152 356 H1176 V332"/>
    </g>
    <text x="34" y="350" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#2f4459" dx="24">CH1 CURVE  ·  CH2 AMM</text>
    <text x="1166" y="350" text-anchor="end" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#2f4459" dx="-24">BIGINT · LAMPORTS</text>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="379" rx="18" fill="none" stroke="#1e3a4c"/>
</svg>
